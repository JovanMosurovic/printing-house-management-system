<h2>Forgot password</h2>

<form #forgotPasswordForm="ngForm">
  <div>
    Username or email:
    <input type="text" name="usernameOrEmail"
           [(ngModel)]="forgotPasswordData.usernameOrEmail"
           #usernameOrEmail="ngModel" required>

    @if (usernameOrEmail.touched && usernameOrEmail.errors?.["required"]) {
      <p>Username or email is required.</p>
    }
  </div>

  <div class="form-actions">
    <button type="button" (click)="sendResetLink(forgotPasswordForm)">Send reset link</button>
    <p class="feedback-message" [class.feedback-error]="messageIsError" aria-live="polite">{{message}}</p>
  </div>
</form>

<p><a class="back-link" routerLink="/">Back to login</a></p>
