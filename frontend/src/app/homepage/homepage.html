<h2>Login</h2>

<div>
  Username: <input type="text" name="username" [(ngModel)]="loginUser.username">
</div>

<div>
  Password: <input type="password" name="password" [(ngModel)]="loginUser.password">
</div>

<button type="button" (click)="login()" [disabled]="!loginUser.username || !loginUser.password">Login</button>

<p>
  Don't have an account?
  <a routerLink="/register">Register</a>
</p>
