<h2>Login</h2>

<form #loginForm="ngForm">
  <div>
    Username:
    <input type="text" name="username" [(ngModel)]="loginUser.username" #username="ngModel" required>

    @if (username.touched && username.errors?.["required"]) {
      <p>Username is required.</p>
    }
  </div>

  <div>
    Password:
    <input type="password" name="password" [(ngModel)]="loginUser.password" #password="ngModel" required>

    @if (password.touched && password.errors?.["required"]) {
      <p>Password is required.</p>
    }
  </div>

  <button type="button" (click)="login(loginForm)">Login</button>
</form>

@if (message) {
  <p>{{message}}</p>
}

<p>
  Don't have an account?
  <a routerLink="/register">Register</a>
</p>

<p>
  <a routerLink="/forgot-password">Forgot password?</a>
</p>
